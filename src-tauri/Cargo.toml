[package]
name = "mystation"
version = "0.7.0"
description = "MyStation — battery and thermal control for Dell laptops"
edition = "2024"
license = "MIT"

[lib]
name = "mystation_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
libloading = "0.9.0"
mystation-core = { path = "../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.7.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.13.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_Usb", "Win32_System_Power", "Win32_Globalization", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_System_EventLog", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_NetworkManagement_WiFi"] }
wmi = "0.18.4"
