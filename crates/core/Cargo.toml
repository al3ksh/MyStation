[package]
name = "mystation-core"
version = "0.7.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
quick-xml = "0.42"

[dev-dependencies]
tempfile = "3"
